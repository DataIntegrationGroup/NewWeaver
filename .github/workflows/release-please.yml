name: release-please

# Keeps one open release PR that collects every merge to main. Merging that
# PR bumps package.json, updates CHANGELOG.md, tags vX.Y.Z and publishes a
# GitHub release. Deploys are unaffected (see deploy.yml).

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
